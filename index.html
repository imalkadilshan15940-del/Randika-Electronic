<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Dashboard</title>
<style>
  :root{--bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;--text:#1a1916;--text2:#6b6960;--text3:#9a9890;--accent:#d4501a;--red:#c02828;--red-bg:#fdeaea;--green:#1a7a3c}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
  h1{font-size:20px;margin:0}
  .sub{font-size:12px;color:var(--text3);margin:2px 0 0}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
  .card .n{font-size:24px;font-weight:700}
  .card .l{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--text2)}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
  .section h2{font-size:14px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase}
  tr.low td{background:var(--red-bg);color:var(--red)}
  tr.neg td{color:var(--red)}
  .badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:600}
  .badge.low{background:var(--red-bg);color:var(--red)}
  .badge.ok{background:#e9f7ee;color:var(--green)}
  .empty{color:var(--text3);font-size:13px;padding:10px 0}
  .err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:14px;font-size:13px}
  #search{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:10px}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--text3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⚡</div>
    <div>
      <h1>Stock Dashboard</h1>
      <div class="sub" id="genAt">Loading…</div>
    </div>
  </header>

  <div id="content"></div>
</div>

<script>
let DATA = null;
let activeTab = 'inventory';

async function load(){
  const el = document.getElementById('content');
  try{
    const r = await fetch('Database/summary.json?_=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    render();
  }catch(e){
    el.innerHTML = '<div class="err">Could not load summary.json — ' + (e.message||e) + '<br>Make sure the backend has synced at least once (Settings → GitHub dashboard sync → Sync now).</div>';
    document.getElementById('genAt').textContent = '';
  }
}

function setTab(t){ activeTab = t; render(); }

function render(){
  const d = DATA;
  document.getElementById('genAt').textContent = 'Last updated: ' + new Date(d.generatedAt).toLocaleString();

  const inv = d.inventory || {items:[], itemCount:0, lowStockCount:0};
  const totalStock = (inv.items||[]).reduce((s,i)=>s+(i.inStock||0),0);
  const totalRevenue = (d.salesHistory||[]).reduce((s,r)=>s+(Number(r.total)||0),0);
  const totalProfit = (d.salesHistory||[]).reduce((s,r)=>s+(Number(r.profit)||0),0);
  const totalExpenses = (d.expenses||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);

  const cards = `
    <div class="cards">
      <div class="card"><div class="n">${inv.itemCount||0}</div><div class="l">Items tracked</div></div>
      <div class="card"><div class="n" style="color:${inv.lowStockCount?'var(--red)':'var(--text)'}">${inv.lowStockCount||0}</div><div class="l">Low stock</div></div>
      <div class="card"><div class="n">${totalStock}</div><div class="l">Units in stock</div></div>
      <div class="card"><div class="n">${fmt(totalRevenue)}</div><div class="l">Total revenue</div></div>
      <div class="card"><div class="n" style="color:${totalProfit<0?'var(--red)':'var(--green)'}">${fmt(totalProfit)}</div><div class="l">Total profit</div></div>
      <div class="card"><div class="n">${fmt(totalExpenses)}</div><div class="l">Total expenses</div></div>
    </div>`;

  const tabs = `
    <div class="tabs">
      <button class="tab ${activeTab==='inventory'?'active':''}" onclick="setTab('inventory')">Inventory</button>
      <button class="tab ${activeTab==='sales'?'active':''}" onclick="setTab('sales')">Sales History</button>
      <button class="tab ${activeTab==='expenses'?'active':''}" onclick="setTab('expenses')">Expenses</button>
      <button class="tab ${activeTab==='pl'?'active':''}" onclick="setTab('pl')">Profit &amp; Loss</button>
    </div>`;

  let body = '';
  if(activeTab==='inventory') body = renderInventory(inv);
  else if(activeTab==='sales') body = renderSales(d.salesHistory||[]);
  else if(activeTab==='expenses') body = renderExpenses(d.expenses||[]);
  else if(activeTab==='pl') body = renderProfitLoss(d.profitLoss||[]);

  document.getElementById('content').innerHTML = cards + tabs + body;
}

function fmt(n){ return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function renderInventory(inv){
  const rows = (inv.items||[]).map(i => `
    <tr class="${i.lowStock?'low':''}">
      <td>${esc(i.name)}${i.sku?'<br><span class="mono">'+esc(i.sku)+'</span>':''}</td>
      <td>${esc(i.category||'')}</td>
      <td>${i.inStock} ${esc(i.unit||'')}</td>
      <td>${i.minQty}</td>
      <td>${i.price!=null?fmt(i.price):'—'}</td>
      <td>${i.sellPrice!=null?fmt(i.sellPrice):'—'}</td>
      <td>${i.lowStock ? '<span class="badge low">Low</span>' : '<span class="badge ok">OK</span>'}</td>
    </tr>`).join('');
  return `
    <div class="section">
      <h2>Inventory</h2>
      <input id="search" type="text" placeholder="Search items…" oninput="filterItems(this.value)">
      <table id="itemsTable">
        <thead><tr><th>Item</th><th>Category</th><th>In stock</th><th>Min qty</th><th>Cost</th><th>Sell price</th><th>Status</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">No items yet</td></tr>'}</tbody>
      </table>
    </div>`;
}

function renderSales(sales){
  const rows = sales.map(s => {
    const itemsStr = (s.items||[]).map(i => `${esc(i.name)} ×${i.qty}`).join(', ');
    return `
    <tr class="${s.profit<0?'neg':''}">
      <td>${esc(s.receiptNo)}<br><span class="mono">${new Date(s.ts).toLocaleString()}</span></td>
      <td>${esc(s.customerName||'')}</td>
      <td>${esc(itemsStr)}</td>
      <td>${esc(s.payMethod||'')}</td>
      <td>${fmt(s.total)}</td>
      <td>${fmt(s.profit)}</td>
    </tr>`;
  }).join('');
  return `
    <div class="section">
      <h2>Sales History</h2>
      <table>
        <thead><tr><th>Receipt</th><th>Customer</th><th>Items</th><th>Payment</th><th>Total</th><th>Profit</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No sales yet</td></tr>'}</tbody>
      </table>
    </div>`;
}

function renderExpenses(expenses){
  const rows = expenses.map(e => `
    <tr>
      <td>${esc(e.date||'')}</td>
      <td>${esc(e.category||'')}</td>
      <td>${esc(e.description||'')}</td>
      <td>${esc(e.paidBy||'')}</td>
      <td>${fmt(e.amount)}</td>
    </tr>`).join('');
  return `
    <div class="section">
      <h2>Expenses</h2>
      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid by</th><th>Amount</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">No expenses recorded</td></tr>'}</tbody>
      </table>
    </div>`;
}

function renderProfitLoss(pl){
  const rows = pl.map(m => `
    <tr class="${m.netProfit<0?'neg':''}">
      <td>${esc(m.month)}</td>
      <td>${fmt(m.revenue)}</td>
      <td>${fmt(m.grossProfit)}</td>
      <td>${fmt(m.expenses)}</td>
      <td><strong>${fmt(m.netProfit)}</strong></td>
    </tr>`).join('');
  return `
    <div class="section">
      <h2>Profit &amp; Loss</h2>
      <table>
        <thead><tr><th>Month</th><th>Revenue</th><th>Gross profit</th><th>Expenses</th><th>Net profit</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">No data yet</td></tr>'}</tbody>
      </table>
    </div>`;
}

function filterItems(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#itemsTable tbody tr').forEach(tr=>{
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load();
</script>
</body>
</html>
